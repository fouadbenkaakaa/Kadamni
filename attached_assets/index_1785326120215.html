<!DOCTYPE html>

<head>

<!-- Tailwind (utility classes, JIT compiles at runtime, works with dynamic DOM) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
  :root{
    --bg:#F3FBF4; --card:#FFFFFF; --primary:#1FAA59; --primaryDark:#128A45;
    --primarySoft:#E4F8EA; --primarySofter:#EFFBF2; --text:#12261B; --sub:#6B8A78;
    --border:#DCEFE1; --amber:#F5A623; --danger:#EF4444;
  }
  html,body{height:100%;margin:0;font-family:"Segoe UI","Tahoma",sans-serif;background:#0B1712;}
  * {box-sizing:border-box;}
  input,textarea,select,button{font-family:inherit;}
  input:focus,textarea:focus,select:focus{outline:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  #phone{
    width:100%;max-width:420px;height:100%;max-height:900px;
    background:var(--bg);border-radius:28px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .app-outer{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;}

  .screen{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .scroll{flex:1;overflow-y:auto;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);}
  .icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:9999px;background:transparent;border:none;cursor:pointer;}
  .icon-btn:active{background:rgba(0,0,0,.05);}

  .field{display:flex;align-items:center;gap:8px;border-radius:16px;padding:0 14px;height:48px;background:var(--primarySofter);border:1px solid var(--border);}
  .field input, .field select{flex:1;background:transparent;border:none;font-size:13.5px;color:var(--text);width:100%;}

  .btn{height:48px;border-radius:16px;font-weight:700;font-size:14px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;}
  .btn:active{opacity:.8;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-ghost{background:var(--primarySoft);color:var(--primaryDark);}

  .card{background:var(--card);border:1px solid var(--border);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:0 12px;height:32px;border-radius:9999px;font-size:11.5px;font-weight:700;border:none;cursor:pointer;}

  .bottomnav{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:64px;flex-shrink:0;background:var(--card);border-top:1px solid var(--border);}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;background:none;border:none;cursor:pointer;}
  .navitem span{font-size:10px;font-weight:600;}

  .avatar-wrap{position:relative;flex-shrink:0;}
  .avatar-wrap img{border-radius:9999px;object-fit:cover;display:block;}
  .avail-dot{position:absolute;bottom:-1px;left:-1px;width:14px;height:14px;border-radius:9999px;border:2px solid #fff;background:#22C55E;}

  .sheet-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);}
  .sheet{position:relative;width:100%;max-width:420px;border-radius:24px 24px 0 0;background:var(--card);display:flex;flex-direction:column;max-height:85%;}

  .fade-in{animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  input[type="range"]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);accent-color:var(--primary);}
  input[type="checkbox"]{accent-color:var(--primary);width:16px;height:16px;}

  .toggle{width:40px;height:24px;border-radius:9999px;position:relative;border:none;cursor:pointer;transition:.2s;}
  .toggle span{position:absolute;top:2px;width:20px;height:20px;border-radius:9999px;background:#fff;transition:.2s;}
</style>
</head>
<body>

<div class="app-outer">
  <div id="phone">
    <div id="screen-root" class="screen"></div>
  </div>

/* ============================================================

   Organized to mirror a component-based structure so it can be
   ported to React / Vue / any framework later:
     - DATA        : mock/demo data (swap with real API calls)
     - STATE       : global reactive app state
     - UI HELPERS  : small reusable "components" (return HTML strings)
     - SCREENS     : one render function per screen (like a page/view)
     - NAV         : go()/back() router
     - RENDER      : main render loop

/* ---------------------------- STATE ---------------------------- */
const STATE = {
  screen: "splash",
  history: [],
  payload: null,
  favorites: [1],
  filterOpen: false,
  menuOpen: false,
  userType: "seeker",
  dark: false,
  lang: "ar",
  callSeconds: 15,
  callTimer: null,
  callMicOn: true,
  callSpeakerOn: false,
  notifs: JSON.parse(JSON.stringify(NOTIFS)),
  chats: JSON.parse(JSON.stringify(CHATS)),
};

/* ---------------------------- NAV ---------------------------- */
function go(screen, payload){
  if(screen === "post-menu"){ STATE.menuOpen = true; render(); return; }
  stopCallTimer();
  STATE.history.push(STATE.screen);
  STATE.screen = screen;
  STATE.payload = payload || null;
  STATE.menuOpen = false;
  if(screen === "call") startCallTimer();
  render();
  const sr = document.getElementById("screen-root");
  if(sr) sr.scrollTop = 0;
}
function back(){
  stopCallTimer();
  STATE.screen = STATE.history.pop() || "home";
  render();
}
function toggleFav(id){
  const i = STATE.favorites.indexOf(id);
  if(i>-1) STATE.favorites.splice(i,1); else STATE.favorites.push(id);
  render();
}
function closeSheet(){ STATE.filterOpen = false; STATE.menuOpen = false; render(); }

/* ---------------------------- UI HELPERS ---------------------------- */
function icon(name, size=18, color="currentColor", extra=""){
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px;color:${color};" ${extra}></i>`;
}

function topBar(title, showBack, rightHtml=""){
  return `
  <div class="topbar">
    <button class="icon-btn" onclick="${showBack ? 'back()' : ''}">${showBack ? icon('chevron-right',22,'var(--text)') : ''}</button>
    <div style="font-weight:700;font-size:15px;color:var(--text)">${title}</div>
    <div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center">${rightHtml}</div>
  </div>`;
}

function field(iconName, placeholder, id="", extra="", value=""){
  return `
  <div class="field">
    ${iconName ? icon(iconName,17,'var(--sub)') : ""}
    <input id="${id}" placeholder="${placeholder}" value="${value}" ${extra}/>
  </div>`;
}

function btn(label, onclick, variant="primary", extraClass="", extraAttrs=""){
  const cls = variant === "primary" ? "btn-primary" : variant === "outline" ? "btn-outline" : "btn-ghost";
  return `<button class="btn ${cls} ${extraClass}" onclick="${onclick}" ${extraAttrs}>${label}</button>`;
}

function stars(v, size=12){
  return `<div style="display:flex;align-items:center;gap:2px">${icon('star',size,'var(--amber)','fill=\"var(--amber)\"')}<span style="font-size:${size+1}px;color:var(--text);font-weight:700">${v}</span></div>`;
}

function avatar(seed, size=44, available=false){
  return `
  <div class="avatar-wrap" style="width:${size}px;height:${size}px">
    <img src="https://i.pravatar.cc/100?img=${seed}" style="width:${size}px;height:${size}px" />
    ${available ? '<span class="avail-dot"></span>' : ''}
  </div>`;
}

function chip(iconName, label, onclick){
  return `<button class="chip" style="background:var(--primarySoft);color:var(--primaryDark)" onclick="${onclick}">${icon(iconName,13)} ${label}</button>`;
}

}

/* ---------------------------- BOTTOM NAV ---------------------------- */
const NAV_SCREENS = ["home","search","messages","profile"];
function bottomNav(){
  const items = [
    {id:"home", label:"الرئيسية", icon:"home"},
    {id:"search", label:"البحث", icon:"search"},
    {id:"post-menu", label:"إضافة", icon:"plus", cta:true},
    {id:"messages", label:"الرسائل", icon:"message-circle"},
    {id:"profile", label:"الحساب", icon:"user"},
  ];
  return `
  <div class="bottomnav">
    ${items.map(it=>{
      if(it.cta){
        return `<button class="navitem" style="margin-top:-24px" onclick="go('post-menu')">
          <div style="width:48px;height:48px;border-radius:9999px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(31,170,89,.35);background:var(--primary)">${icon('plus',24,'#fff')}</div>
        </button>`;
      }
      const active = STATE.screen === it.id;
      return `<button class="navitem" onclick="go('${it.id}')">
        ${icon(it.icon, 21, active ? 'var(--primary)' : 'var(--sub)')}
        <span style="color:${active ? 'var(--primary)' : 'var(--sub)'}">${it.label}</span>
      </button>`;
    }).join("")}
  </div>`;
}

function sendChat(chatId){
  const input = document.getElementById("chat-input");
  if(!input || !input.value.trim()) return;
  const c = STATE.chats.find(x=>x.id===chatId);
  c.messages.push({from:"me", text: input.value.trim(), time:"الآن"});
  c.last = input.value.trim(); c.time = "الآن";
  render();
  const scroll = document.getElementById("chat-scroll");
  if(scroll) scroll.scrollTop = scroll.scrollHeight;
}

function startCallTimer(){
  STATE.callSeconds = 15;

    STATE.callSeconds++;

      const ss = String(STATE.callSeconds%60).padStart(2,"0");
      el.textContent = `مكالمة صوتية · ${mm}:${ss}`;
    }
  }, 1000);
}

}
function sendAI(text){
  const input = document.getElementById("ai-input");
  const q = text || (input && input.value.trim());
  if(!q) return;
  STATE.aiMessages.push({from:"me", text:q});
  if(input) input.value = "";
  render();
  setTimeout(()=>{
    STATE.aiMessages.push({from:"ai", text:"وجدت لك بعض النتائج المناسبة بناءً على طلبك، يمكنك مراجعتها في صفحة النتائج."});
    render();
    const scroll = document.getElementById("ai-scroll");
    if(scroll) scroll.scrollTop = scroll.scrollHeight;
  }, 600);
}
